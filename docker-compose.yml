services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: playverse
      POSTGRES_PASSWORD: playverse
      POSTGRES_DB: playverse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U playverse -d playverse"]
      interval: 3s
      timeout: 5s
      retries: 20

  web:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://playverse:playverse@db:5432/playverse
      UPLOAD_DIR: /data/uploads
      NODE_ENV: production
    volumes:
      - ./data/uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
