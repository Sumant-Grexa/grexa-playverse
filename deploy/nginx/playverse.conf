# Copy to the VM:
#   sudo cp deploy/nginx/playverse.conf /etc/nginx/sites-available/playverse
#   sudo ln -sf /etc/nginx/sites-available/playverse /etc/nginx/sites-enabled/playverse
#   sudo nginx -t && sudo systemctl reload nginx
# Then:
#   sudo certbot --nginx -d playverse.grexa.ai
# Set COOKIE_SECURE=true in the VM .env and recreate the web container.
# Keep Docker on localhost only: 127.0.0.1:3000:3000

server {
  listen 80;
  listen [::]:80;
  server_name playverse.grexa.ai;

  client_max_body_size 12m;

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 60s;
  }
}
